[workspace]
resolver = "2"
members = ["crates/crossword-core", "crates/crossword-render", "crates/crossword-kindle", "crates/crossword-desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
crossword-core = { path = "crates/crossword-core" }
crossword-render = { path = "crates/crossword-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
